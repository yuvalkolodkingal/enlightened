# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment mappings (better parameter names): https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# Environment Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.256
loader_version_range=[1,)

## Mod Properties

# The unique mod identifier for the mod. Must match the String constant in the main mod class annotated with @Mod.
mod_id=enlightened
mod_name=Enlightened
mod_license=All Rights Reserved
mod_version=1.0.8
# true: the next push to main publishes a full release of mod_version (once), not an alpha build
release_build=true
mod_group_id=com.kolodkingal.enlightened
