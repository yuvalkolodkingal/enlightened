pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// The copies of the mod for the Minecraft versions after 1.21.1 (docs/MULTIVERSION.md).
include ':v1_21_4'
project(':v1_21_4').projectDir = file('versions/1.21.4')
include ':v1_21_5'
project(':v1_21_5').projectDir = file('versions/1.21.5')
include ':v1_21_11'
project(':v1_21_11').projectDir = file('versions/1.21.11')
// (26.3 is compiled with Java 25, which its toolchain fetches; the copy is Java 21 class files like the rest)
include ':v26_3'
project(':v26_3').projectDir = file('versions/26.3')
