modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Eilon Kolodkin-Gal (ideas), Yuval Kolodkin-Gal"
description='''
Become a bender of the Avatar world: an earthbender who throws rock, wears earth armour and raises walls, and learns
sand, lava and metal; an airbender who blasts, shields, glides and leaves his body; a waterbender who whips, heals,
grows tentacles and rides a spout, and learns ice and blood; or a firebender who shoots, whips, rings and heals with
fire, and learns lightning. Every kill with your bending earns ability points; spend them on the abilities you want
and pick the ones you take into battle.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
