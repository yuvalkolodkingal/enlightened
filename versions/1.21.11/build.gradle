// Enlightened's copy for Minecraft 1.21.11: the shared sources (../../src/main/java) through Preprocess, compiled
// against NeoForge 21.11. The root project puts its classes into the one jar (docs/MULTIVERSION.md).
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

def mc = '1.21.11'
def copySuffix = 'v1_21_11'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def preprocess = tasks.register('preprocess', Preprocess) {
    source = rootProject.file('src/main/java')
    target = layout.buildDirectory.dir('preprocessed/java')
    overlays.from(file('../1.21.4/src/main/java'), file('../1.21.5/src/main/java'), file('src/main/java'))
    renames.from(file('../1.21.4/renames.txt'), file('../1.21.5/renames.txt'), file('renames.txt'))
    minecraft = mc
    suffix = copySuffix
    basePackage = 'com.kolodkingal.enlightened'
}
sourceSets.main.java.srcDirs = [preprocess.map { it.target }]

neoForge {
    version = '21.11.48'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '100000'])
}
